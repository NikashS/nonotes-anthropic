[project]
name = "nonotes-anthropic-backend"
version = "0.1.0"
description = "Focus-aware spatial AI backend for No Notes"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.128.1",
  "httpx>=0.28.1",
  "pydantic>=2.10.4",
  "psycopg[binary]>=3.2.4",
  "python-dotenv>=1.0.1",
  "sqlalchemy>=2.0.36",
  "uvicorn>=0.34.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.3.4", "pytest-asyncio>=0.25.0"]

[tool.setuptools]
packages = []
